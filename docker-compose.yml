services:
  deepai2api:
    image: ${IMAGE:-ghcr.io/nka551774-hue/deepai2api:latest}
    build:
      context: .
    init: true
    shm_size: 256mb
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PUBLISH_PORT:-3737}:3737"
    environment:
      HOST: 0.0.0.0
      PORT: "3737"
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Taipei}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env before starting}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-12}
      ALLOW_ANONYMOUS_FALLBACK: ${ALLOW_ANONYMOUS_FALLBACK:-true}
      ALLOW_OPEN_WHEN_NO_KEYS: ${ALLOW_OPEN_WHEN_NO_KEYS:-true}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-180000}
      UPSTREAM_LANGUAGE: ${UPSTREAM_LANGUAGE:-zh-hans}
      MAX_LOG_ENTRIES: ${MAX_LOG_ENTRIES:-500}
      UPSTREAM_KEYS: ${UPSTREAM_KEYS:-}
      ACCOUNT_COOKIES: ${ACCOUNT_COOKIES:-}
      BROWSER_LOGIN_ENABLED: ${BROWSER_LOGIN_ENABLED:-true}
      BROWSER_LOGIN_TTL_SECONDS: ${BROWSER_LOGIN_TTL_SECONDS:-600}
      BROWSER_LOGIN_MAX_SESSIONS: ${BROWSER_LOGIN_MAX_SESSIONS:-2}
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
